<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b5bf0"/>
      <stop offset="0.55" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#2e1f87"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff8a1f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#14103a" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14103a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS-style tile: 824px with the system corner radius, centred in a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#gloss)"/>

  <!-- the page -->
  <g filter="url(#soft)">
    <path d="M338 232 H600 L720 352 V752 Q720 792 680 792 H338 Q298 792 298 752 V272 Q298 232 338 232 Z" fill="#ffffff"/>
  </g>
  <path d="M600 232 V312 Q600 352 640 352 H720 Z" fill="#c9cdfb"/>

  <!-- text lines -->
  <rect x="352" y="424" width="262" height="30" rx="15" fill="#4f46e5"/>
  <rect x="352" y="496" width="214" height="30" rx="15" fill="#a5a8f7"/>
  <rect x="352" y="568" width="238" height="30" rx="15" fill="#a5a8f7"/>

  <!-- "next": a double chevron, outlined in the tile colour so it separates from the page -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M572 606 L676 710 L572 814 M690 606 L794 710 L690 814" stroke="#2b1d80" stroke-width="112"/>
    <path d="M572 606 L676 710 L572 814 M690 606 L794 710 L690 814" stroke="url(#amber)" stroke-width="76"/>
  </g>
</svg>
