name: build-main

# Every push to main that changes the app builds a macOS .dmg and a Windows .exe and attaches them to the run
# as downloadable artifacts (kept 30 days). These are test builds, not releases: nothing is published and no
# version is created. For a real release use the "release-next-notepad" workflow (tag a version).
on:
  push:
    branches: [main]
    paths:
      - "notepad-next/**"
      - ".github/workflows/build-main.yml"
  workflow_dispatch:

# A newer push replaces a build that is still running for the same branch.
concurrency:
  group: build-main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            args: "--bundles dmg"
            artifact_glob: "notepad-next/src-tauri/target/release/bundle/dmg/*.dmg"
          - os: windows-latest
            name: windows
            args: "--bundles nsis"
            artifact_glob: "notepad-next/src-tauri/target/release/bundle/nsis/*.exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: notepad-next/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: notepad-next/src-tauri

      - name: Install dependencies
        run: npm ci
        working-directory: notepad-next

      - name: Build the app (no release is created without a tagName)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: notepad-next
          args: ${{ matrix.args }}

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          # The short commit id in the name tells you which check-in a download came from.
          name: next-notepad-${{ matrix.name }}-${{ github.sha }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 30
